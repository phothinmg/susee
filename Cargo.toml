[package]
name = "susee"
version = "2.3.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/suseejs/susee_bundler"
readme = "README.md"
description = "A high-performance TypeScript library bundler"
exclude = ["src/rust/main.rs"]

[dependencies]
oxc = { version = "0.148.0", features = [
    "ast_visit",
    "codegen",
    "semantic",
    "minifier",
    "transformer",
    "isolated_declarations",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
colored = "2"
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[lib]
name = "susee"
path = "src/rust/lib.rs"

[[bin]]
name = "susee_main"
path = "src/rust/main.rs"