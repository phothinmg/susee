[package]
name = "susee"
version = "1.6.2"
edition = "2024"

[dependencies]
indexmap = { version = "2", features = ["serde"] }
oxc = { version = "0.144.0", features = ["serialize", "ast_visit", "codegen", "semantic", "isolated_declarations"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# N-API bindings for the JS bridge. Gated behind the `napi` feature so the
# rlib (used by the `susee_main` CLI binary) does not pull in node headers.
# `serde-json` enables `serde_json::Value` ↔ JS object conversion at the
# napi boundary.
napi = { version = "3", optional = true, default-features = false, features = ["napi9", "serde-json"] }
napi-derive = { version = "3", optional = true }
swc_core = { version = "77.0.1", features = ["common", "ecma_ast", "ecma_parser", "ecma_parser_typescript", "ecma_codegen", "ecma_visit", "ecma_transforms_typescript", "ecma_transforms_module"] }

[features]
default = []
# Enable the N-API JS bridge (parse/visit/print + node predicates). Produces
# a `cdylib` that Node loads as a native addon. See `src/rust/napi/`.
napi = ["dep:napi", "dep:napi-derive"]

[[bin]]
name = "susee_main"
path = "src/rust/main.rs"

[lib]
name = "susee"
path = "src/rust/lib.rs"
# `rlib` for the CLI binary + integration tests; `cdylib` for the Node
# native addon (only built when the `napi` feature is on).
crate-type = ["rlib", "cdylib"]

[dev-dependencies]
tempfile = "3"
