[package]
name = "susee"
version = "1.6.2"
edition = "2024"

[dependencies]
indexmap = { version = "2", features = ["serde"] }
oxc = { version = "0.147.0", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tempfile = "3"
# Ensure the sourcemap feature is enabled here
# oxc_codegen = { version = "0.147.0", features = ["sourcemap"] } 

# N-API bindings for the JS bridge. Gated behind the `napi` feature so the
# rlib (used by the `susee_main` CLI binary) does not pull in node headers.
# `serde-json` enables `serde_json::Value` ↔ JS object conversion at the
# napi boundary.
# `async` enables the tokio runtime so the `#[napi] async fn` build driver
# can await JS plugin callbacks (sync and async) via ThreadsafeFunction.
# napi = { version = "3", optional = true, default-features = false, features = ["napi9", "serde-json", "async"] }
# napi-derive = { version = "3", optional = true }

# [features]
# default = []
# # Enable the N-API JS bridge (parse/visit/print + node predicates). Produces
# # a `cdylib` that Node loads as a native addon. See `src/rust/napi/`.
# napi = ["dep:napi", "dep:napi-derive"]

[[bin]]
name = "susee_main"
path = "src/main.rs"

[lib]
name = "susee"
path = "src/lib.rs"
# `rlib` for the CLI binary + integration tests; `cdylib` for the Node
# native addon (only built when the `napi` feature is on).
# crate-type = ["rlib", "cdylib"]

# [dev-dependencies]
# tempfile = "3"
