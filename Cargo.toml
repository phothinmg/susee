[package]
name = "susee"
version = "1.6.2"
edition = "2024"

[dependencies]
indexmap = { version = "2", features = ["serde"] }
oxc = { version = "0.144.0", features = ["serialize", "ast_visit"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[[bin]]
name = "susee_main"
path = "src/rust/main.rs"

[lib]
name = "susee_lib"
path = "src/rust/lib.rs"

[dev-dependencies]
tempfile = "3"